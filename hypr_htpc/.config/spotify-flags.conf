# Spotify (CEF) on NVIDIA Wayland — without --disable-gpu-sandbox the
# GPU process fails ("GPU process isn't usable") and the app exits silently.
# ANGLE+OpenGL matches helium-browser-flags on this GTX 1060.

--disable-gpu-sandbox
--ignore-gpu-blocklist
--ozone-platform=wayland
--use-gl=angle
--use-angle=gl
--disable-features=Vulkan
