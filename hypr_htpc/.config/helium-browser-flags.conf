# Helium/Chromium - NVIDIA VA-API on Wayland for the HTPC TV profile
# flags.conf is read by /opt/helium-browser-bin/helium-wrapper for every launch.
# Use ANGLE+OpenGL (not Vulkan) — Vulkan ANGLE on GTX 1060 Wayland draws blank window.

--ozone-platform=wayland
--ignore-gpu-blocklist
--enable-gpu-rasterization
--enable-zero-copy
# Readable UI at native 4K / couch distance
--force-device-scale-factor=1.35
--use-gl=angle
--use-angle=gl
--enable-features=AcceleratedVideoDecodeLinuxGL,AcceleratedVideoDecodeLinuxZeroCopyGL,VaapiOnNvidiaGPUs,VaapiIgnoreDriverChecks,WaylandLinuxDrmSyncobj,UseSkiaRenderer
--disable-features=Vulkan
