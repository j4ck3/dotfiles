# Keep the compositor environment minimal. App-specific NVIDIA/VA-API
# variables belong in app wrappers such as ~/.local/bin/helium-browser.
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# HDR disabled for safe boot — re-enable after Hyprland starts reliably
# env = ENABLE_HDR_WSI,1

# NVIDIA 580 driver supports atomic modeset + buffer modifiers. Do NOT set
# AQ_NO_ATOMIC / AQ_NO_MODIFIERS here: the legacy DRM path forces modifier-less
# GBM buffers that fail to import via drmModeAddFB2 (supportsAddFb2Modifiers:
# false), so every mode fails KMS import and Hyprland can't start.

# Cursor size (32 at 4K with 1.25x scale; 24 for safe 1080p boot)
env = XCURSOR_SIZE,32

# VRR off — no benefit for movies; avoids flicker on Pascal + HDMI 2.0
env = __GL_VRR_ALLOWED,0

env = COLOR_SCHEME,prefer-light
env = GTK_THEME,Adwaita
env = GTK2_RC_FILES,$HOME/.gtkrc-2.0
env = QT_QPA_PLATFORMTHEME,gtk3
env = QT_STYLE_OVERRIDE,Fusion
