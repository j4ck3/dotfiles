## Cava config for OpenWhispr dictation overlay waveform.
## PULSE_SOURCE set by dictation-waveform.sh (Sound Blaster capture).

[general]
framerate = 60
bars = 48
autosens = 1
sensitivity = 200
lower_cutoff_freq = 60
higher_cutoff_freq = 12000
sleep_timer = 0

[input]
method = pulse
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10
channels = mono
mono_option = average

[smoothing]
monstercat = 0
waves = 0
integral = 0
gravity = 0
noise_reduction = 0
ignore = 0
