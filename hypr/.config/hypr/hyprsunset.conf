# Makes hyprsunset do nothing to the screen by default
# Without this, the default applies some tint to the monitor
profile {
    time = 07:00
    identity = true
}

# NOTE: On this AMD + LG setup, hyprsunset IPC works but DRM CTM blob stays
# empty — no visible effect. Quickshell BRT widget uses decoration:screen_shader
# instead (see quickshell/scripts/display-control.sh).
#
# Daemon may still autostart; safe but unused for the bar widget.
# Optional timed night profile:
# profile {
#     time = 20:00
#     temperature = 4000
# }
