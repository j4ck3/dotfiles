# Theme-matched lock (black/white, mirrors Quickshell Theme).
# Session lock client: hyprlock (ext-session-lock-v1).
# Quickshell lockscreen.qml is disabled — WlSessionLock was crashing the session.

general {
    hide_cursor = true
    ignore_empty_input = true
    fail_timeout = 2000
}

auth {
    pam {
        enabled = true
        module = hyprlock
    }
    fingerprint {
        enabled = true
        ready_message = Scan fingerprint
        present_message = Scanning...
        retry_delay = 250
    }
}

animations {
    enabled = false
}

background {
    monitor =
    color = rgba(0, 0, 0, 1.0)
    path = screenshot
    blur_passes = 2
    blur_size = 6
    brightness = 0.55
    contrast = 0.9
    noise = 0.01
}

label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 1.0)
    font_size = 72
    font_family = SF Pro Text
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %-d"
    color = rgba(255, 255, 255, 0.55)
    font_size = 16
    font_family = SF Pro Text
    position = 0, 10
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgba(255, 255, 255, 0.9)
    font_size = 15
    font_family = SF Pro Text
    position = 0, -50
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 420, 48
    position = 0, -110
    halign = center
    valign = center

    inner_color = rgba(255, 255, 255, 0.10)
    outer_color = rgba(255, 255, 255, 0.18)
    outline_thickness = 1
    check_color = rgba(255, 255, 255, 0.45)
    fail_color = rgba(255, 77, 77, 0.9)

    font_family = SF Pro Text
    font_color = rgba(255, 255, 255, 1.0)
    placeholder_text = Password
    fail_text = Incorrect password

    rounding = 16
    shadow_passes = 0
    fade_on_empty = false
    dots_size = 0.25
    dots_spacing = 0.3
}
