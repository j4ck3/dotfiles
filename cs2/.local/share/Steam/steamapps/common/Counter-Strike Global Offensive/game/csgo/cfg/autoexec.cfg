// CS2 autoexec - radar shows whole map

cl_radar_scale "0.3"                    // map zoom inside radar: 0.25 (most zoomed out) to 1.0. 0.3 fits most maps
cl_radar_always_centered "0"            // don't keep radar centered on you, so map edges stay visible
cl_radar_rotate "1"                     // radar rotates with view (set 0 for fixed north-up)
cl_hud_radar_scale "1.15"               // radar box size on screen: 0.8 to 1.3. bigger box = easier to read when zoomed out
cl_radar_icon_scale_min "0.6"           // keep player dots readable when zoomed out
cl_radar_square_with_scoreboard "1"     // square full-map radar when holding TAB

exec dj                                 // load dj.cfg

echo "autoexec loaded"
host_writeconfig
