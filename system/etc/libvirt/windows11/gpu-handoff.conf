# Machine profile: CachyOS + Hyprland + RX 7900 XTX (single-GPU passthrough)
# Live in repo: system/etc/libvirt/windows11/gpu-handoff.conf (no install step)

# Callers (libvirt hooks) pass their own guest name; only default it here.
DOMAIN="${DOMAIN:-windows11}"

# libvirt nodedev names (virsh nodedev-list | grep 03_00)
GPU_NODE=pci_0000_03_00_0
AUDIO_NODE=pci_0000_03_00_1

# PCI BDF for virsh/virt-xml helpers
GPU_PCI=0000:03:00.0
AUDIO_PCI=0000:03:00.1

# Ly runs as templated TTY units on this host; no display-manager.service alias exists.
DISPLAY_MANAGER_UNITS=(ly@tty1.service ly@tty2.service)
CONSOLE_USER=jacke

# Seconds after stopping Hyprland before detach (joeknock90 / VFIO-Tools use ~2–3)
DETACH_SLEEP=3

# 1 = skip EFI framebuffer unbind/bind (try if AMD host acts up; RX 7900 usually keeps 0)
SKIP_EFI_FB=0

# 1 = modprobe -r amdgpu after display stack is down, before virsh nodedev-detach
UNLOAD_AMGPU=1

# Seconds to wait for Hyprland/Xwayland after stopping display manager units
DISPLAY_STOP_TIMEOUT=12

# Post-VM host recovery. Fixes cases where managed USB/evdev passthrough or VM
# shutdown leaves keyboard/mouse or LAN bridge half-attached on the host.
RECOVER_INPUT=1
USB_HID_IDS=(1532:007a 3434:0108 1532:007b 361d:0100 041e:324d)

RECOVER_NETWORK=1
NETWORK_CONNECTIONS=(br0 eno1 "Wired connection 1")

# After passthrough ends, start ly (login manager). Host GPU must be back first.
# 1 = also try Hyprland after DRM is up. 0 = ly only (recommended; Hyprland
# from this hook has no seat and used to skip ly → black screen).
AUTO_RESTORE_HYPRLAND=0

# Seconds to wait for /dev/dri/card* after reattach (async restore-ly unit).
# RX 7900 XTX after VFIO commonly needs ~90s (PSP/SMU). Do not set below 60.
DRM_WAIT_SECONDS=120

# Short wait inside the libvirt hook itself — do not block qemu release long.
# Full wait lives in windows11-restore-ly.service.
HOOK_DRM_WAIT_SECONDS=20

# After unbind from vfio: PCI remove + bus rescan before modprobe amdgpu.
# Required on Navi 31 — bare modprobe after VFIO hits amdgpu_device_mm_access BUG.
PCI_REMOVE_RESCAN=1
REATTACH_SETTLE=5
# Seconds after PCI rescan before explicit amdgpu probe (udev stays frozen).
AMDGPU_PROBE_SETTLE=10
AMDGPU_LOAD_RETRIES=2
